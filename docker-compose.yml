services:
  bot:
    build:
      context: .
    image: discord-pickup-bot:latest
    container_name: discord-pickup-bot
    restart: unless-stopped
    init: true
    env_file:
      - .env
    # Both sides read the same variable so changing HTTP_PORT in .env cannot
    # desync them: the server would report itself listening while every button
    # timed out. Harmless when PUBLIC_BASE_URL is blank and nothing listens.
    ports:
      - "${HTTP_PORT:-18080}:${HTTP_PORT:-18080}"
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/pickup.db
      HEARTBEAT_PATH: /tmp/heartbeat
      AUDIT_LOG_PATH: /audit/audit.log
    volumes:
      - pickup-data:/data
      # Bound to the host rather than a named volume: the point of the audit log
      # is being readable without reaching into the container. The directory must
      # be writable by uid 1000 — see the README.
      - ./audit:/audit
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pickup-data:
