services:
  bot:
    build:
      context: .
    image: discord-pickup-bot:latest
    container_name: discord-pickup-bot
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/pickup.db
      HEARTBEAT_PATH: /tmp/heartbeat
    volumes:
      - pickup-data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pickup-data:
